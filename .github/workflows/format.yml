name: Format repository

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-dev
  cancel-in-progress: false

jobs:
  format:
    name: Apply repository formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format supported text files with Prettier
        run: npx --yes prettier@3.6.2 --write . --ignore-unknown

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Format Python files with Ruff
        run: uvx ruff@0.14.0 format backend

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All tracked files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository formatting"
          git push origin HEAD:dev
