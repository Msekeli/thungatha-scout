<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="90 70 400 390">
  <title>Thungatha icon</title>
  <desc>Blue briefcase with a cyan magnifying glass and mint accent, on a transparent background.</desc>
  <defs>
    <linearGradient id="caseBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20D4F4"/>
      <stop offset="0.52" stop-color="#078FEA"/>
      <stop offset="1" stop-color="#0874D8"/>
    </linearGradient>
    <linearGradient id="lensBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24D5F3"/>
      <stop offset="1" stop-color="#078BE8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61F0BD"/>
      <stop offset="1" stop-color="#20CFA0"/>
    </linearGradient>
  </defs>
  <!-- Briefcase handle -->
  <path d="M177 120V98c0-15 12-27 27-27h104c15 0 27 12 27 27v22h-27V99H204v21Z" fill="url(#caseBlue)"/>
  <!-- Main briefcase body -->
  <path d="M91 153c0-20 16-36 36-36h257c20 0 36 16 36 36v209c0 20-16 36-36 36H127c-20 0-36-16-36-36Z" fill="url(#caseBlue)"/>
  <path d="M119 164h274v195c0 5-4 9-9 9H128c-5 0-9-4-9-9Z" fill="#07172A"/>
  <path d="M91 153c0-20 16-36 36-36h257c20 0 36 16 36 36v28H91Z" fill="url(#caseBlue)"/>
  <path d="M119 164h274v17H119Z" fill="#087CCF" opacity=".75"/>
  <!-- Magnifying glass rim and lens -->
  <circle cx="344" cy="291" r="105" fill="#06162A"/>
  <circle cx="344" cy="291" r="82" fill="url(#lensBlue)"/>
  <circle cx="344" cy="291" r="57" fill="#07172A"/>
  <circle cx="344" cy="291" r="34" fill="url(#mint)"/>
  <!-- Handle, layered for clean contrast -->
  <path d="M416 363l59 59c10 10 10 26 0 36s-26 10-36 0l-59-59Z" fill="#06162A"/>
  <path d="M430 372l48 48c7 7 7 18 0 25s-18 7-25 0l-48-48Z" fill="url(#lensBlue)"/>
  <!-- Mint signal/accent dot -->
  <circle cx="405" cy="130" r="34" fill="url(#mint)"/>
</svg>
